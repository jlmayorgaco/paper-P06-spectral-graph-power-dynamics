[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-ibr"
version = "0.1.0"
description = "Clean architecture scaffold for spectral graph power dynamics research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "scipy>=1.12",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "black>=24.4",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.4",
]

[project.scripts]
spectral-ibr = "spectral_ibr.interface.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
packages = ["spectral_ibr"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
